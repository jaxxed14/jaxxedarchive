<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Notice</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { padding: 4px 4px 6px; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }

  /* ---------- Banner (everyone sees this) ---------- */
  #banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: #800080;
    color: #222;
    border: 2px solid #222;
    border-radius: 12px;
    box-shadow: 0 3px 0 #222;
    font-size: 16px;
    font-weight: 600;
    animation: pop .3s ease-out;
  }
  #bannerText { overflow-wrap: anywhere; }
  #bannerClose {
    flex: none;
    border: 0;
    background: transparent;
    color: #222;
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
  }
  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* ---------- Admin button + panel ---------- */
  #openBtn {
    padding: 8px 14px;
    border: 2px solid #222;
    border-radius: 999px;
    background: #fff;
    color: #222;
    font-weight: 600;
  }
  #openBtn:hover { background: #f2f2f2; }
  #panel {
    margin-top: 8px;
    padding: 12px;
    width: 100%;
    max-width: 340px;
    background: #fff;
    color: #222;
    border: 2px solid #222;
    border-radius: 12px;
    box-shadow: 0 3px 0 #222;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input[type=password], textarea {
    width: 100%;
    padding: 8px;
    border: 2px solid #222;
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    padding: 7px 12px;
    border: 2px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-weight: 600;
  }
  .btn.primary { background: #222; color: #fff; }
  #status { min-height: 18px; margin-top: 8px; font-size: 13px; }
  #status.err { color: #b00020; }
  #status.ok  { color: #0a7a2f; }

  #setupError { font-size: 13px; color: #b00020; padding: 6px; }
</style>
</head>
<body>

<div id="setupError" class="hidden">Setup not finished: paste your Firebase config into index.html.</div>

<!-- Banner mode: ?mode=banner (or no mode at all) -->
<div id="banner" class="hidden" role="status" aria-live="polite">
  <span id="bannerText"></span>
  <button id="bannerClose" type="button" aria-label="Dismiss">&#10005;</button>
</div>

<!-- Admin mode: ?mode=admin -->
<div id="admin" class="hidden">
  <button id="openBtn" type="button">&#128227; Admin</button>

  <div id="panel" class="hidden">
    <div id="lockView">
      <label for="code">Enter code</label>
      <input id="code" type="password" autocomplete="new-password" spellcheck="false">
      <div class="row">
        <button id="unlockBtn" class="btn primary" type="button">Unlock</button>
        <button id="closeBtn1" class="btn" type="button">Close</button>
      </div>
    </div>

    <div id="menuView" class="hidden">
      <label for="msg">Message to show everyone</label>
      <textarea id="msg" rows="3" maxlength="300" placeholder="Type your message..."></textarea>
      <div class="row">
        <button id="sendBtn" class="btn primary" type="button">Send</button>
        <button id="clearBtn" class="btn" type="button">Clear</button>
        <button id="closeBtn2" class="btn" type="button">Close</button>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, goOffline, goOnline }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ============================================================
  // PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project
  // settings > Your apps > Web app > Config). These values are
  // safe to be public; your database rules are what protect it.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC7_n5f5x1a1bz8Cko_3E7nzhX4sBp362w",
    authDomain: "jaxxedarchive.firebaseapp.com",
    databaseURL: "https://jaxxedarchive-default-rtdb.firebaseio.com",
    projectId: "jaxxedarchive",
    storageBucket: "jaxxedarchive.firebasestorage.app",
    messagingSenderId: "495939418727",
    appId: "1:495939418727:web:32a574d4b492647ee8f2c2",
    measurementId: "G-JXCV65ZQG6"
  };

  const $ = (id) => document.getElementById(id);
  const mode = new URLSearchParams(location.search).get("mode") === "admin" ? "admin" : "banner";

  if (firebaseConfig.databaseURL.startsWith("PASTE")) {
    $("setupError").classList.remove("hidden");
  } else {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    if (mode === "admin") startAdmin(db);
    else startBanner(db, firebaseConfig.databaseURL);
  }

  // ------------------------------------------------------------
  // Banner: shows the current message to every visitor
  // ------------------------------------------------------------
  let memDismissed = null;
  function getDismissed() {
    try { return localStorage.getItem("siteNoticeDismissed"); } catch (e) { return memDismissed; }
  }
  function setDismissed(v) {
    memDismissed = v;
    try { localStorage.setItem("siteNoticeDismissed", String(v)); } catch (e) {}
  }

  function startBanner(db, dbUrl) {
    const banner = $("banner");
    const bannerText = $("bannerText");
    let connected = false;
    let lastData = null;

    function render(v) {
      if (!v || !v.text) { banner.classList.add("hidden"); return; }
      if (String(getDismissed()) === String(v.id)) { banner.classList.add("hidden"); return; }
      bannerText.textContent = v.text; // textContent, so messages can't inject HTML
      banner.classList.remove("hidden");
    }

    $("bannerClose").addEventListener("click", () => {
      if (lastData) setDismissed(lastData.id);
      banner.classList.add("hidden");
    });

    // Live updates
    onValue(ref(db, ".info/connected"), (snap) => { connected = snap.val() === true; });
    onValue(
      ref(db, "message/public"),
      (snap) => { lastData = snap.val(); render(lastData); },
      (err) => console.error(err)
    );

    // Fallback: if the live connection isn't up (for example the free plan's
    // 100-connection cap is full), read the message with a plain request instead.
    async function poll() {
      if (connected || document.hidden) return;
      try {
        const r = await fetch(dbUrl.replace(/\/$/, "") + "/message/public.json", { cache: "no-store" });
        if (r.ok) { lastData = await r.json(); render(lastData); }
      } catch (e) { /* try again next time */ }
    }
    poll();
    setInterval(poll, 30000);

    // Free up connection slots from background tabs
    let offlineTimer = null;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        offlineTimer = setTimeout(() => goOffline(db), 30000);
      } else {
        clearTimeout(offlineTimer);
        goOnline(db);
      }
    });
  }

  // ------------------------------------------------------------
  // Admin: code box + message menu
  // The code is NOT in this file. It's checked by the database
  // rules on Firebase's servers.
  // ------------------------------------------------------------
  function startAdmin(db) {
    $("admin").classList.remove("hidden");

    const panel = $("panel");
    const lockView = $("lockView");
    const menuView = $("menuView");
    const status = $("status");
    const codeInput = $("code");
    const msgInput = $("msg");
    let key = null; // kept in memory only, never saved

    const setStatus = (msg, kind) => { status.textContent = msg || ""; status.className = kind || ""; };
    const withTimeout = (p, ms) =>
      Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
    const isDenied = (e) =>
      String((e && (e.code || e.message)) || "").toUpperCase().includes("PERMISSION_DENIED");
    // Ignores capitals, extra spaces and a trailing period
    const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[\s.]+$/, "");

    function lockAndClose() {
      key = null;
      codeInput.value = "";
      msgInput.value = "";
      setStatus("");
      menuView.classList.add("hidden");
      lockView.classList.remove("hidden");
      panel.classList.add("hidden");
      goOffline(db); // free the connection slot
    }

    $("openBtn").addEventListener("click", () => {
      if (panel.classList.contains("hidden")) {
        panel.classList.remove("hidden");
        if (!key) codeInput.focus();
      } else {
        lockAndClose();
      }
    });
    $("closeBtn1").addEventListener("click", lockAndClose);
    $("closeBtn2").addEventListener("click", lockAndClose);

    async function unlock() {
      const attempt = normalize(codeInput.value);
      if (!attempt) return;
      setStatus("Checking...");
      try {
        goOnline(db);
        // The database only accepts this write if the code matches.
        await withTimeout(set(ref(db, "ping"), { key: attempt, t: Date.now() }), 8000);
        key = attempt;
        codeInput.value = "";
        lockView.classList.add("hidden");
        menuView.classList.remove("hidden");
        setStatus("");
        msgInput.focus();
      } catch (e) {
        setStatus(isDenied(e) ? "Wrong code." : "Couldn't reach the server. Try again.", "err");
      }
    }
    $("unlockBtn").addEventListener("click", unlock);
    codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

    async function push(text) {
      setStatus("Sending...");
      try {
        goOnline(db);
        await withTimeout(set(ref(db, "message"), { key, public: { text, id: Date.now() } }), 8000);
        setStatus(text ? "Sent! Everyone will see it in a few seconds." : "Cleared.", "ok");
      } catch (e) {
        setStatus(
          isDenied(e) ? "Code rejected. Close and unlock again." : "Couldn't reach the server. Try again.",
          "err"
        );
      }
    }

    $("sendBtn").addEventListener("click", () => {
      const text = msgInput.value.trim();
      if (!text) { setStatus("Type a message first.", "err"); return; }
      push(text);
    });
    $("clearBtn").addEventListener("click", () => push(""));
  }
</script>
</body>
</html>
