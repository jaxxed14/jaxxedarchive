<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Notice</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body { padding: 4px 4px 6px; }
  .hidden { display: none !important; }
  button {
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Banner (everyone sees this) ---------- */
  #banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: #7c3aed;
    color: #fff;
    border: 2px solid #2e1065;
    border-radius: 12px;
    box-shadow: 0 3px 0 #2e1065;
    font-size: 16px;
    font-weight: 600;
    animation: pop .3s ease-out;
  }
  #bannerText { overflow-wrap: anywhere; }
  #bannerClose {
    flex: none;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    padding: 8px 10px;
  }
  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* Sound on/off button shown under the banner */
  #soundRow { margin-top: 8px; }
  #soundBtn {
    min-height: 40px;
    padding: 6px 14px;
    border: 2px solid #2e1065;
    border-radius: 999px;
    background: #fff;
    color: #2e1065;
    font-size: 14px;
    font-weight: 600;
  }
  #soundBtn.attn { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, .6); }
    50%      { box-shadow: 0 0 0 8px rgba(124, 58, 237, 0); }
  }

  /* ---------- Admin button + panel ---------- */
  #openBtn {
    min-height: 44px;
    padding: 8px 14px;
    border: 2px solid #222;
    border-radius: 999px;
    background: #fff;
    color: #222;
    font-weight: 600;
  }
  #openBtn:hover { background: #f2f2f2; }
  #panel {
    margin-top: 8px;
    padding: 12px;
    width: 100%;
    max-width: 360px;
    background: #fff;
    color: #222;
    border: 2px solid #222;
    border-radius: 12px;
    box-shadow: 0 3px 0 #222;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input[type=password], textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font: inherit;
    font-size: 16px; /* 16px or bigger stops iPhone Safari from zooming in on tap */
    resize: vertical;
    -webkit-appearance: none;
    appearance: none;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    min-height: 44px;
    padding: 7px 14px;
    border: 2px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-weight: 600;
  }
  .btn.primary { background: #222; color: #fff; }
  #status { min-height: 18px; margin-bottom: 8px; font-size: 13px; }
  #status.err { color: #b00020; }
  #status.ok  { color: #0a7a2f; }

  .section { margin-top: 14px; padding-top: 10px; border-top: 2px dashed #ccc; }
  .linkBtn {
    border: 0;
    background: transparent;
    color: #5b21b6;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    padding: 4px;
  }
  #soundList {
    max-height: 150px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border: 2px solid #222;
    border-radius: 8px;
  }
  #soundList .note { padding: 10px; font-size: 13px; color: #555; }
  .soundBtn {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 0;
    border-bottom: 1px solid #ddd;
    background: #fff;
    color: #222;
    text-align: left;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .soundBtn:last-child { border-bottom: 0; }
  .soundBtn:active { background: #efe7ff; }

  #setupError { font-size: 13px; color: #b00020; padding: 6px; }
</style>
</head>
<body>

<div id="setupError" class="hidden"></div>

<!-- Banner mode: ?mode=banner (or no mode at all) -->
<div id="banner" class="hidden" role="status" aria-live="polite">
  <span id="bannerText"></span>
  <button id="bannerClose" type="button" aria-label="Dismiss">&#10005;</button>
</div>
<div id="soundRow" class="hidden">
  <button id="soundBtn" type="button"></button>
</div>

<!-- Admin mode: ?mode=admin -->
<div id="admin" class="hidden">
  <button id="openBtn" type="button">&#128227; Admin</button>

  <div id="panel" class="hidden">
    <div id="status"></div>

    <div id="lockView">
      <label for="code">Enter code</label>
      <input id="code" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div class="row">
        <button id="unlockBtn" class="btn primary" type="button">Unlock</button>
        <button id="closeBtn1" class="btn" type="button">Close</button>
      </div>
    </div>

    <div id="menuView" class="hidden">
      <label for="msg">Message to show everyone</label>
      <textarea id="msg" rows="3" maxlength="300" placeholder="Type your message..."></textarea>
      <div class="row">
        <button id="sendBtn" class="btn primary" type="button">Send</button>
        <button id="clearBtn" class="btn" type="button">Clear</button>
      </div>

      <div class="section">
        <label>Sounds in the repository <button id="refreshBtn" class="linkBtn" type="button">refresh</button></label>
        <div id="soundList"></div>
        <div class="row">
          <button id="stopSoundBtn" class="btn" type="button">&#9632; Stop sound</button>
        </div>
      </div>

      <div class="row">
        <button id="closeBtn2" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, goOffline, goOnline }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Your Firebase config lives in firebase-config.js (next to this file).

  // Where to look for audio files. Leave the first two blank and the page works
  // them out from its own address (https://YOURNAME.github.io/REPONAME/).
  const GITHUB_OWNER = "";
  const GITHUB_REPO = "";
  const GITHUB_BRANCH = "main";

  const AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba)$/i;
  const SOUND_MAX_AGE_MS = 45000; // ignore sounds older than this (e.g. a phone that just woke up)

  let memDismissed = null; // fallback when the browser blocks storage inside embeds (common on iPhone/iPad)
  const $ = (id) => document.getElementById(id);
  const mode = new URLSearchParams(location.search).get("mode") === "admin" ? "admin" : "banner";

  function showSetupError(msg) {
    const el = $("setupError");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  async function main() {
    let firebaseConfig;
    try {
      ({ firebaseConfig } = await import("./firebase-config.js"));
    } catch (e) {
      showSetupError("Can't find firebase-config.js. Upload it to the same place as index.html.");
      return;
    }
    if (!firebaseConfig || String(firebaseConfig.databaseURL || "").startsWith("PASTE")) {
      showSetupError("Setup not finished: paste your Firebase config into firebase-config.js.");
      return;
    }
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    if (mode === "admin") startAdmin(db);
    else startBanner(db, firebaseConfig.databaseURL);
  }

  // ------------------------------------------------------------
  // Banner: shows the current message to every visitor
  // ------------------------------------------------------------
  function getDismissed() {
    try { return localStorage.getItem("siteNoticeDismissed"); } catch (e) { return memDismissed; }
  }
  function setDismissed(v) {
    memDismissed = v;
    try { localStorage.setItem("siteNoticeDismissed", String(v)); } catch (e) {}
  }

  function startBanner(db, dbUrl) {
    const banner = $("banner");
    const bannerText = $("bannerText");
    let connected = false;
    let lastData = null;

    function render(v) {
      if (!v || !v.text) { banner.classList.add("hidden"); return; }
      if (String(getDismissed()) === String(v.id)) { banner.classList.add("hidden"); return; }
      bannerText.textContent = v.text; // textContent, so messages can't inject HTML
      banner.classList.remove("hidden");
    }

    $("bannerClose").addEventListener("click", () => {
      if (lastData) setDismissed(lastData.id);
      banner.classList.add("hidden");
    });

    // Live updates
    onValue(ref(db, ".info/connected"), (snap) => { connected = snap.val() === true; });
    onValue(
      ref(db, "message/public"),
      (snap) => { lastData = snap.val(); render(lastData); },
      (err) => console.error(err)
    );

    // Fallback: if the live connection isn't up (for example the free plan's
    // 100-connection cap is full), read the message with a plain request instead.
    // (Sounds only work over the live connection.)
    async function poll() {
      if (connected || document.hidden) return;
      try {
        const r = await fetch(dbUrl.replace(/\/$/, "") + "/message/public.json", { cache: "no-store" });
        if (r.ok) { lastData = await r.json(); render(lastData); }
      } catch (e) { /* try again next time */ }
    }
    poll();
    setInterval(poll, 30000);

    // Free up connection slots from background tabs
    let offlineTimer = null;
    function wake() {
      clearTimeout(offlineTimer);
      goOnline(db);
      poll();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        offlineTimer = setTimeout(() => goOffline(db), 30000);
      } else {
        wake();
      }
    });
    // iPhones and iPads freeze pages in the background, so catch up the moment one wakes
    window.addEventListener("pageshow", wake);
    window.addEventListener("online", wake);

    startSound(db);
  }

  // ------------------------------------------------------------
  // Sound: plays whatever the admin picks, on every open page.
  // Browsers (iPhone especially) refuse to play sound until the
  // visitor taps something on the page, so there's a one-tap
  // "turn on sound" button. After that, sounds play on their own.
  // ------------------------------------------------------------
  function soundUrl(file) {
    if (typeof file !== "string" || !file.trim()) return null;
    if (/^[a-z][a-z0-9+.-]*:/i.test(file) || file.startsWith("//")) return null; // relative paths only
    const encoded = file.replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/");
    try {
      const u = new URL(encoded, location.href);
      return u.origin === location.origin ? u.href : null;
    } catch (e) {
      return null;
    }
  }

  function makeSilentWav() {
    const sampleRate = 8000, samples = 80;
    const buf = new ArrayBuffer(44 + samples * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, samples * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  function startSound(db) {
    const row = $("soundRow");
    const btn = $("soundBtn");

    const audio = new Audio();
    audio.preload = "auto";
    let unlocked = false;   // has the browser allowed this page to make sound?
    let unlocking = false;
    let baselineSet = false;
    let lastId = null;
    let silentUrl = null;

    // Any tap, click or key press on the box counts as the "OK to play sound" gesture.
    const GESTURES = ["click", "touchend", "keydown"];
    let listening = false;
    function addGestureListeners() {
      if (listening) return;
      listening = true;
      GESTURES.forEach((t) => document.addEventListener(t, unlock, true));
    }
    function removeGestureListeners() {
      listening = false;
      GESTURES.forEach((t) => document.removeEventListener(t, unlock, true));
    }

    // Only shown when the browser refuses to play sound without a tap.
    function showPrompt(pulse) {
      btn.textContent = "\u{1F507} Tap to turn on sound";
      row.classList.remove("hidden");
      if (pulse) {
        btn.classList.remove("attn");
        void btn.offsetWidth; // restart the pulse animation
        btn.classList.add("attn");
      }
      addGestureListeners();
    }

    // Plays a silent blip. If the browser allows it, this page can make sound from now on,
    // and the button goes away for good.
    function unlock() {
      if (unlocked || unlocking) return;
      unlocking = true;
      if (!silentUrl) silentUrl = makeSilentWav();
      audio.src = silentUrl;
      Promise.resolve(audio.play())
        .then(() => {
          unlocked = true;
          unlocking = false;
          row.classList.add("hidden");
          removeGestureListeners();
        })
        .catch(() => {
          unlocking = false;
          showPrompt(false);
        });
    }

    function handleSound(v) {
      const id = v && typeof v.id === "number" ? v.id : null;
      // The first value we see is whatever was already there when the page loaded: don't play it.
      if (!baselineSet) { baselineSet = true; lastId = id; return; }
      if (id === null || id === lastId) return;
      lastId = id;

      if (!v.file) { audio.pause(); return; }               // admin pressed Stop
      if (Date.now() - id > SOUND_MAX_AGE_MS) return;        // too old to matter
      const url = soundUrl(v.file);
      if (!url) return;

      audio.src = url;
      const p = audio.play();
      if (p && p.catch) {
        p.catch(() => { // browser said no: ask for a tap
          unlocked = false;
          showPrompt(true);
        });
      }
    }

    onValue(ref(db, "sound/public"), (snap) => handleSound(snap.val()), (err) => console.error(err));

    // Try to switch sound on right away. Some browsers allow it; if not, the tap prompt appears.
    unlock();
  }

  // ------------------------------------------------------------
  // Finding audio files in the GitHub repo (admin only)
  // ------------------------------------------------------------
  function repoInfo() {
    let owner = GITHUB_OWNER;
    let repo = GITHUB_REPO;
    if ((!owner || !repo) && location.hostname.endsWith(".github.io")) {
      owner = owner || location.hostname.split(".")[0];
      const first = location.pathname.split("/").filter(Boolean)[0];
      repo = repo || (first && !first.includes(".") ? first : owner + ".github.io");
    }
    return owner && repo ? { owner, repo } : null;
  }

  async function listAudio() {
    const info = repoInfo();
    if (!info) throw new Error("no-repo");
    const branches = [...new Set([GITHUB_BRANCH, "main", "master"])];
    let lastErr = null;
    for (const b of branches) {
      try {
        const url = "https://api.github.com/repos/" + info.owner + "/" + info.repo +
                    "/git/trees/" + encodeURIComponent(b) + "?recursive=1";
        const r = await fetch(url);
        if (r.status === 403) throw new Error("rate");
        if (!r.ok) { lastErr = new Error("http " + r.status); continue; }
        const data = await r.json();
        return (data.tree || [])
          .filter((n) => n.type === "blob" && AUDIO_EXT.test(n.path))
          .map((n) => n.path)
          .sort((a, b2) => a.localeCompare(b2));
      } catch (e) {
        if (e.message === "rate") throw e;
        lastErr = e;
      }
    }
    throw lastErr || new Error("failed");
  }

  // ------------------------------------------------------------
  // Admin: code box + message menu + sound list
  // The code is NOT in this file. It's checked by the database
  // rules on Firebase's servers.
  // ------------------------------------------------------------
  function startAdmin(db) {
    $("admin").classList.remove("hidden");

    const panel = $("panel");
    const lockView = $("lockView");
    const menuView = $("menuView");
    const status = $("status");
    const codeInput = $("code");
    const msgInput = $("msg");
    const soundList = $("soundList");
    let key = null; // kept in memory only, never saved

    const setStatus = (msg, kind) => { status.textContent = msg || ""; status.className = kind || ""; };
    const withTimeout = (p, ms) =>
      Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
    const isDenied = (e) =>
      String((e && (e.code || e.message)) || "").toUpperCase().includes("PERMISSION_DENIED");
    // Ignores capitals, extra spaces and a trailing period
    const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[\s.]+$/, "");

    function lockAndClose() {
      key = null;
      codeInput.value = "";
      msgInput.value = "";
      soundList.textContent = "";
      setStatus("");
      menuView.classList.add("hidden");
      lockView.classList.remove("hidden");
      panel.classList.add("hidden");
      goOffline(db); // free the connection slot
    }

    $("openBtn").addEventListener("click", () => {
      if (panel.classList.contains("hidden")) {
        panel.classList.remove("hidden");
        if (!key) codeInput.focus();
      } else {
        lockAndClose();
      }
    });
    $("closeBtn1").addEventListener("click", lockAndClose);
    $("closeBtn2").addEventListener("click", lockAndClose);

    async function unlock() {
      const attempt = normalize(codeInput.value);
      if (!attempt) return;
      setStatus("Checking...");
      try {
        goOnline(db);
        // The database only accepts this write if the code matches.
        await withTimeout(set(ref(db, "ping"), { key: attempt, t: Date.now() }), 8000);
        key = attempt;
        codeInput.value = "";
        lockView.classList.add("hidden");
        menuView.classList.remove("hidden");
        setStatus("");
        msgInput.focus();
        loadSounds();
      } catch (e) {
        setStatus(isDenied(e) ? "Wrong code." : "Couldn't reach the server. Try again.", "err");
      }
    }
    $("unlockBtn").addEventListener("click", unlock);
    codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

    // Writes to /message or /sound. Firebase checks the code again on its side.
    async function publish(node, publicData, okText, deniedText) {
      setStatus("Sending...");
      try {
        goOnline(db);
        await withTimeout(set(ref(db, node), { key, public: publicData }), 8000);
        setStatus(okText, "ok");
      } catch (e) {
        setStatus(
          isDenied(e) ? (deniedText || "Code rejected. Close and unlock again.") : "Couldn't reach the server. Try again.",
          "err"
        );
      }
    }

    $("sendBtn").addEventListener("click", () => {
      const text = msgInput.value.trim();
      if (!text) { setStatus("Type a message first.", "err"); return; }
      publish("message", { text, id: Date.now() }, "Sent! Everyone will see it in a few seconds.");
    });
    $("clearBtn").addEventListener("click", () => {
      publish("message", { text: "", id: Date.now() }, "Cleared.");
    });

    // ----- sounds -----
    const soundDenied = "Rejected. Make sure you published the updated database rules.";

    function addNote(text) {
      const d = document.createElement("div");
      d.className = "note";
      d.textContent = text;
      soundList.appendChild(d);
    }

    async function loadSounds() {
      soundList.textContent = "";
      addNote("Loading sounds...");
      try {
        const files = await listAudio();
        soundList.textContent = "";
        if (!files.length) { addNote("No audio files found in the repository yet."); return; }
        for (const f of files) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "soundBtn";
          b.textContent = "▶ " + f;
          b.title = f;
          b.addEventListener("click", () =>
            publish("sound", { file: f, id: Date.now() }, "Playing " + f + " for everyone.", soundDenied)
          );
          soundList.appendChild(b);
        }
      } catch (e) {
        soundList.textContent = "";
        const m = e && e.message;
        if (m === "rate") addNote("GitHub is limiting requests for a bit. Try again in a few minutes.");
        else if (m === "no-repo") addNote("Can't tell which GitHub repo this is. Set GITHUB_OWNER and GITHUB_REPO at the top of index.html.");
        else addNote("Couldn't read the repository. It needs to be public.");
      }
    }
    $("refreshBtn").addEventListener("click", loadSounds);
    $("stopSoundBtn").addEventListener("click", () => {
      publish("sound", { file: "", id: Date.now() }, "Stopped.", soundDenied);
    });
  }

  main();
</script>
</body>
</html>
